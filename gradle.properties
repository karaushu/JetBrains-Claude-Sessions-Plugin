pluginGroup = dev.andy.claudesessions
pluginVersion = 1.0.1

# WebStorm 2026.2.0.1, build 262.8665.341
platformType = WS
platformVersion = 2026.2.0.1

# Branch 262 requires Java 25.
javaVersion = 25

# The Kotlin stdlib is supplied by the IDE. Bundling our own breaks at runtime.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2048m -XX:+UseParallelGC
# Off deliberately: the build cache served stale test results that reported success for
# code that no longer compiled against its tests. On a project this size the saving is not
# worth misleading feedback.
org.gradle.caching = false
org.gradle.configuration-cache = true
